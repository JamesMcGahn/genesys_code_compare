# Core deployment regions (satellite media regions are excluded).
# https://help.genesys.cloud/articles/aws-regions-for-genesys-cloud-deployment/
# https://help.genesys.cloud/articles/required-genesys-cloud-domains/
# login_url is the OAuth token endpoint; api_url is the base URL without a trailing slash.

# Northern Virginia, United States.
[regions.us-east-1]
login_url = "https://login.mypurecloud.com/oauth/token"
api_url = "https://api.mypurecloud.com"

# Ohio, United States; FedRAMP / U.S. Public Sector.
[regions.us-east-2]
login_url = "https://login.use2.us-gov-pure.cloud/oauth/token"
api_url = "https://api.use2.us-gov-pure.cloud"

# Oregon, United States.
[regions.us-west-2]
login_url = "https://login.usw2.pure.cloud/oauth/token"
api_url = "https://api.usw2.pure.cloud"

